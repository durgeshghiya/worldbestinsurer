name: IndexNow (manual)

# This workflow used to run daily and submit 200 URLs to the Google Indexing
# API. That API is licensed only for pages carrying JobPosting or
# BroadcastEvent structured data; using it for insurance pages breaches its
# terms, and pushing unchanged URLs daily is an artificial indexing request.
# Both were removed on 16 Sep 2026.
#
# What remains is IndexNow (Bing, Yandex, Seznam), which exists to announce
# URLs whose content actually changed. It is manual-only here; the registry
# refresh workflow submits just the URLs its own run changed.
#
# The GOOGLE_SERVICE_ACCOUNT repository secret is no longer used and can be
# deleted.

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run IndexNow for Bing/Yandex
        run: npx tsx scripts/seo/auto-index.ts --all
